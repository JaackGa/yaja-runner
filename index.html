<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html { box-sizing: border-box; color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; font-size: 14px; }
[hidden] { display: none !important; }
</style>
<title>야자수 러너</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* Layout: one portrait 360x640 play field, letterboxed to fit any phone; HTML menus sit over the canvas and scale with --u. */
:root {
  --ink: #1b1b1b;
  --accent: #e8323c;
  --sky-top: #9fd8e8;
  --sky-bot: #f7f0d6;
  --sea: #56b6c6;
  --sand: #f1dba4;
  --sand-d: #d8bb78;
  --leaf: #3f9a4a;
  --leaf-d: #2c7a3a;
  --trunk: #a8743f;
  --coconut: #7a4a2b;
  --panel: #fffaf0;
  --bg: #cfe8e4;
  --font-display: "Jua", "Noto Sans KR", "Apple SD Gothic Neo", sans-serif;
  --font-body: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
}
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  overflow: hidden;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#stage { width: 100%; height: 100%; display: grid; place-items: center; }
#frame {
  --u: 1px;
  position: relative;
  touch-action: none;
  overflow: hidden;
  border-radius: calc(var(--u) * 14);
  box-shadow: 0 0 0 calc(var(--u) * 3) var(--ink);
}
#game { display: block; width: 100%; height: 100%; }

.screen {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}
#start { padding-top: calc(var(--u) * 54); gap: calc(var(--u) * 10); }
#over { justify-content: center; background: rgba(27, 27, 27, .28); }

.title {
  margin: 0;
  font-family: var(--font-display);
  font-weight: 400;
  font-size: calc(var(--u) * 58);
  line-height: 1.02;
  color: var(--accent);
  -webkit-text-stroke: calc(var(--u) * 8) var(--ink);
  paint-order: stroke fill;
  transform: rotate(-3deg);
  text-wrap: balance;
}
.hint {
  margin: calc(var(--u) * 6) 0 0;
  font-size: calc(var(--u) * 14);
  font-weight: 700;
  background: var(--panel);
  border: calc(var(--u) * 2.5) solid var(--ink);
  border-radius: calc(var(--u) * 12);
  padding: calc(var(--u) * 5) calc(var(--u) * 12);
}
.picker { display: flex; gap: calc(var(--u) * 12); margin-top: calc(var(--u) * 4); }
.pick {
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 4);
  font: inherit; font-family: var(--font-display); font-size: calc(var(--u) * 17);
  color: var(--ink);
  background: rgba(255, 250, 240, .55);
  border: calc(var(--u) * 3) dashed rgba(27, 27, 27, .45);
  border-radius: calc(var(--u) * 16);
  padding: calc(var(--u) * 8) calc(var(--u) * 16) calc(var(--u) * 6);
  min-width: calc(var(--u) * 92);
  cursor: pointer;
}
.pick small { font-family: var(--font-body); font-weight: 700; font-size: calc(var(--u) * 12); background: var(--accent); color: #fff; border-radius: 999px; padding: calc(var(--u) * 1) calc(var(--u) * 9); }
.pick img { height: calc(var(--u) * 88); width: auto; display: block; pointer-events: none; }
.pick[aria-pressed="true"] {
  background: var(--panel);
  border: calc(var(--u) * 3) solid var(--ink);
  box-shadow: calc(var(--u) * 4) calc(var(--u) * 4) 0 var(--ink);
  transform: translate(calc(var(--u) * -1), calc(var(--u) * -1));
}
.btn {
  font-family: var(--font-display);
  font-size: calc(var(--u) * 24);
  color: #fff;
  background: var(--accent);
  border: calc(var(--u) * 3) solid var(--ink);
  border-radius: calc(var(--u) * 16);
  box-shadow: calc(var(--u) * 4) calc(var(--u) * 4) 0 var(--ink);
  min-height: 48px;
  padding: calc(var(--u) * 6) calc(var(--u) * 36);
  cursor: pointer;
}
.btn:active { transform: translate(calc(var(--u) * 3), calc(var(--u) * 3)); box-shadow: calc(var(--u) * 1) calc(var(--u) * 1) 0 var(--ink); }
.btn.alt { background: var(--panel); color: var(--ink); font-size: calc(var(--u) * 17); padding: calc(var(--u) * 4) calc(var(--u) * 20); }
.best { margin: 0; font-family: var(--font-display); font-size: calc(var(--u) * 18); background: var(--panel); border: calc(var(--u) * 2.5) solid var(--ink); border-radius: calc(var(--u) * 12); padding: calc(var(--u) * 3) calc(var(--u) * 12); }
.btn:focus-visible, .pick:focus-visible { outline: 3px solid var(--ink); outline-offset: 3px; }

.card {
  width: 78%;
  display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 10);
  background: var(--panel);
  border: calc(var(--u) * 3) solid var(--ink);
  border-radius: calc(var(--u) * 20);
  box-shadow: calc(var(--u) * 6) calc(var(--u) * 6) 0 var(--ink);
  padding: calc(var(--u) * 20) calc(var(--u) * 16);
}
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: calc(var(--u) * 30); color: var(--accent); -webkit-text-stroke: calc(var(--u) * 5) var(--ink); paint-order: stroke fill; }
.result { font-family: var(--font-display); font-size: calc(var(--u) * 54); line-height: 1; font-variant-numeric: tabular-nums; }
.result small { font-size: calc(var(--u) * 22); margin-left: calc(var(--u) * 4); }
.sub { margin: 0; font-size: calc(var(--u) * 15); font-weight: 700; font-variant-numeric: tabular-nums; }
.badge { font-family: var(--font-display); font-size: calc(var(--u) * 16); background: #ffd84a; border: calc(var(--u) * 2.5) solid var(--ink); border-radius: 999px; padding: calc(var(--u) * 2) calc(var(--u) * 12); transform: rotate(-4deg); }
.stack { display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 8); margin-top: calc(var(--u) * 4); }
</style>

</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="game" role="img" aria-label="야자수 러너 게임 화면"></canvas>

    <section id="start" class="screen">
      <h1 class="title">야자수<br>러너</h1>
      <p class="hint">탭하면 점프, 길게 누르면 더 높이</p>
      <div class="picker" role="group" aria-label="캐릭터 선택">
        <button type="button" class="pick" id="pick-yaja" data-char="yaja" aria-pressed="true"><img id="img-yaja" alt=""><span>야자수</span><small>더블 점프</small></button>
        <button type="button" class="pick" id="pick-alice" data-char="alice" aria-pressed="false"><img id="img-alice" alt=""><span>앨리스</span><small>글라이더</small></button>
      </div>
      <button type="button" class="btn" id="go">달리기</button>
      <p class="best" id="best-start" hidden></p>
    </section>

    <section id="over" class="screen" hidden>
      <div class="card">
        <h2>으앗, 넘어졌어요</h2>
        <div class="result"><span id="final">0</span><small>m</small></div>
        <span class="badge" id="newbest" hidden>신기록!</span>
        <p class="sub" id="best-over"></p>
        <div class="stack">
          <button type="button" class="btn" id="again">다시 달리기</button>
          <button type="button" class="btn alt" id="menu">캐릭터 바꾸기</button>
        </div>
      </div>
    </section>
  </div>
</div>

    $("newbest").hidden = !isNew;
    overAt = performance.now() + 450;
    $("over").hidden = false;
  }
  $("pick-yaja").addEventListener("click", function () { setChar("yaja"); });
  $("pick-alice").addEventListener("click", function () { setChar("alice"); });
  $("go").addEventListener("click", startGame);
  $("again").addEventListener("click", function () { if (performance.now() >= overAt) startGame(); });
  $("menu").addEventListener("click", function () { if (performance.now() >= overAt) showStart(); });
  setChar(charKey);
  showStart();

  /* ---------- input ---------- */
  function tryJump() {
    if (P.ground) {
      P.vy = -820; P.ground = false; P.buffer = 0; P.jumps = 1;
      dust(P.x + P.w / 2, GROUND, 5);
    } else if (charKey === "yaja" && P.jumps < 2) {
      P.vy = -740; P.jumps = 2; P.buffer = 0;
      dust(P.x + P.w / 2, P.y - 4, 8, "#ffffff");
    } else {
      P.buffer = 0.12;
    }
  }
  frame.addEventListener("pointerdown", function (e) {
    if (state !== "play") return;
    e.preventDefault(); holding = true; tryJump();
  });
  window.addEventListener("pointerup", function () { holding = false; });
  window.addEventListener("pointercancel", function () { holding = false; });
  window.addEventListener("keydown", function (e) {
    var jumpKey = e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW";
    if (!jumpKey) return;
    if (state === "play") { e.preventDefault(); if (!e.repeat) { holding = true; tryJump(); } }
    else if (state === "ready" && document.activeElement === document.body) { e.preventDefault(); startGame(); }
  });
  window.addEventListener("keyup", function (e) {
    if (e.code === "Space" || e.code === "ArrowUp" || e.code === "KeyW") holding = false;
  });

  /* ---------- world ---------- */
  function dust(x, y, n, col) {
    for (var i = 0; i < n; i++) parts.push({ x: x + (Math.random() - .5) * 14, y: y, vx: (Math.random() - .5) * 120, vy: -Math.random() * 90, life: 0.4 + Math.random() * 0.2, r: 2 + Math.random() * 3, col: col });
  }
  function spawn() {
    sinceSpawn = 0;
    var d = Math.min(dist / 600, 1);
    var pool = [["coconut", 30 - 12 * d], ["sapling", 25 - 8 * d]];
    if (dist > 25) pool.push(["pair", 18]);
    if (dist > 80) pool.push(["tall", 10 + 18 * d]);
    if (dist > 120) pool.push(["triple", 4 + 12 * d]);
    if (dist > 150 && lastType !== "gull") pool.push(["gull", 5 + 10 * d]);
    var total = 0, i;
    for (i = 0; i < pool.length; i++) total += pool[i][1];
    var roll = Math.random() * total, type = pool[0][0];
    for (i = 0; i < pool.length; i++) { roll -= pool[i][1]; if (roll <= 0) { type = pool[i][0]; break; } }
    lastType = type;
    var dims = { coconut: [28, 28, 0], pair: [62, 28, 0], triple: [96, 28, 0], sapling: [26, 58, 0], tall: [28, 82, 0], gull: [34, 20, 128] }[type];
    obs.push({ type: type, x: W + 40, w: dims[0], h: dims[1], bot: dims[2], seed: Math.random() * 6 });
    gap = speed * 0.65 + dims[0] + 200 - 60 * d + Math.random() * (220 - 90 * d);
  }
  function die() {
    state = "dying"; deadT = 0; P.vy = -380; P.vx = -140; shake = 0.35; holding = false;
    dust(P.x + P.w / 2, P.y - 20, 10);
  }

  function update(dt) {
    var k;
    for (k = clouds.length - 1; k >= 0; k--) {
      var c = clouds[k]; c.x -= (10 + (state === "play" ? speed * 0.05 : 0)) * dt;
      if (c.x < -90) { c.x = W + 20; c.y = 40 + Math.random() * 190; }
    }
    for (k = parts.length - 1; k >= 0; k--) {
      var p = parts[k]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 300 * dt;
      if (p.life <= 0) parts.splice(k, 1);
    }
    if (shake > 0) shake -= dt;
    if (toast) { toast.t -= dt; if (toast.t <= 0) toast = null; }

    if (state === "ready") { scroll += 50 * dt; return; }

    if (state === "play") {
      speed = Math.min(260 + dist * 1.6, 480) + Math.min(Math.max(dist - 137, 0) * 0.4, 220);
      var dx = speed * dt; scroll += dx; dist += dx / 40;
      var mile = Math.floor(dist / 100);
      if (mile > lastMile) { lastMile = mile; toast = { txt: (mile * 100) + " m!", t: 1.1 }; }
      sinceSpawn += dx; if (sinceSpawn >= gap) spawn();
      for (k = obs.length - 1; k >= 0; k--) { obs[k].x -= dx * (obs[k].type === "gull" ? 1.15 : 1); if (obs[k].x + obs[k].w < -70) obs.splice(k, 1); }

      if (!holding && P.vy < -420) P.vy = -420;
      P.vy += (P.vy > 0 ? 2900 : 2400) * dt;
      P.gliding = false;
      if (charKey === "alice" && holding && !P.ground && P.vy > 0 && P.glide > 0) {
        P.vy = Math.min(P.vy, 120); P.glide -= dt; P.gliding = true;
      }
      P.y += P.vy * dt;
      if (hintT > 0) hintT -= dt;
      if (P.y >= GROUND) {
        if (!P.ground) dust(P.x + P.w / 2, GROUND, 4);
        P.y = GROUND; P.vy = 0; P.ground = true; P.jumps = 0; P.glide = GLIDE_MAX; P.gliding = false;
        if (P.buffer > 0) tryJump();
      } else { P.ground = false; }
      if (P.buffer > 0) P.buffer -= dt;

      var px1 = P.x + 11, px2 = P.x + P.w - 11, py1 = P.y - P.h + 16, py2 = P.y - 3;
      for (k = 0; k < obs.length; k++) {
        var o = obs[k];
        var bot = o.bot || 0;
        var ox1 = o.x + 3, ox2 = o.x + o.w - 3, oy1 = GROUND - bot - o.h + 4, oy2 = GROUND - bot;
        if (px2 > ox1 && px1 < ox2 && py2 > oy1 && py1 < oy2) { die(); break; }
      }
      return;
    }

    if (state === "dying") {
      deadT += dt;
      P.vy += 2400 * dt; P.y += P.vy * dt; P.x += P.vx * dt;
      if (P.rot > -1.45) P.rot -= 6 * dt;
      if (P.y >= GROUND) { P.y = GROUND; P.vy = 0; P.vx *= 0.85; P.rot = Math.max(P.rot, -1.45); }
      if (deadT > 0.85) gameOver();
    }
  }

  /* ---------- drawing ---------- */
  function ellipse(x, y, rx, ry) { ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); }
  function leaf(cx, cy, ang, len, fill, outline) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(ang);
    ctx.beginPath(); ctx.moveTo(0, 0);
    ctx.quadraticCurveTo(len * .5, -len * .38, len, 0);
    ctx.quadraticCurveTo(len * .5, len * .14, 0, 0); ctx.closePath();
    ctx.fillStyle = fill; ctx.fill();
    if (outline) { ctx.lineWidth = 3; ctx.strokeStyle = INK; ctx.lineJoin = "round"; ctx.stroke(); }
    ctx.restore();
  }
  function palm(x, h, len, trunkW) {
    var by = GROUND, tx = x + 3, ty = GROUND - h + 6;
    ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(x, by); ctx.quadraticCurveTo(x - 6, (by + ty) / 2, tx, ty);
    ctx.lineWidth = trunkW + 6; ctx.strokeStyle = INK; ctx.stroke();
    ctx.lineWidth = trunkW; ctx.strokeStyle = TRUNK; ctx.stroke();
    var back = [2.9, 0.25], front = [-2.95, -2.35, -1.57, -0.79, -0.19], j;
    for (j = 0; j < back.length; j++) leaf(tx, ty, back[j], len * 0.8, LEAFD, true);
    for (j = 0; j < front.length; j++) leaf(tx, ty, front[j], len, LEAF, true);
    ctx.fillStyle = COCO; ctx.lineWidth = 2; ctx.strokeStyle = INK;
    ellipse(tx - 3, ty + 5, 4.5, 4.5); ctx.fill(); ctx.stroke();
    ellipse(tx + 4, ty + 6, 4.5, 4.5); ctx.fill(); ctx.stroke();
  }
  function coconut(cx, r) {
    var cy = GROUND - r;
    ctx.fillStyle = COCO; ctx.lineWidth = 3; ctx.strokeStyle = INK;
    ellipse(cx, cy, r, r); ctx.fill(); ctx.stroke();
    ctx.strokeStyle = "rgba(255,255,255,.35)"; ctx.lineWidth = 2.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(cx, cy, r - 5, Math.PI * 1.15, Math.PI * 1.55); ctx.stroke();
    ctx.fillStyle = INK;
    ellipse(cx - 4.5, cy - 1, 1.8, 2.2); ctx.fill();
    ellipse(cx + 4.5, cy - 1, 1.8, 2.2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx, cy + 3, 3, 0.15 * Math.PI, 0.85 * Math.PI); ctx.lineWidth = 1.8; ctx.strokeStyle = INK; ctx.stroke();
  }
  function gull(o) {
    var cx = o.x + 20, cy = GROUND - o.bot - o.h / 2 + Math.sin(time * 6 + o.seed) * 3;
    var flap = Math.sin(time * 14 + o.seed);
    ctx.lineJoin = "round"; ctx.lineWidth = 2.5; ctx.strokeStyle = INK;
    ctx.fillStyle = "#ffb02e";
    ctx.beginPath(); ctx.moveTo(cx - 14, cy - 3); ctx.lineTo(cx - 23, cy); ctx.lineTo(cx - 14, cy + 1); ctx.closePath(); ctx.fill(); ctx.stroke();
    ctx.fillStyle = "#ffffff";
    ellipse(cx, cy, 13, 7.5); ctx.fill(); ctx.stroke();
    ellipse(cx - 10, cy - 3, 6, 5.5); ctx.fill(); ctx.stroke();
    ctx.fillStyle = INK; ellipse(cx - 12, cy - 4, 1.4, 1.4); ctx.fill();
    var wy = -15 * flap;
    ctx.fillStyle = "#ffffff";
    ctx.beginPath(); ctx.moveTo(cx - 3, cy - 3); ctx.quadraticCurveTo(cx + 6, cy - 4 + wy, cx + 20, cy + wy * 0.5 - 2); ctx.quadraticCurveTo(cx + 8, cy + 1, cx - 3, cy - 1); ctx.closePath(); ctx.fill(); ctx.stroke();
  }
  function drawObstacle(o) {
    if (o.type === "gull") gull(o);
    else if (o.type === "triple") { coconut(o.x + 14, 14); coconut(o.x + 48, 14); coconut(o.x + 82, 14); }
    else if (o.type === "coconut") coconut(o.x + 14, 14);
    else if (o.type === "pair") { coconut(o.x + 14, 14); coconut(o.x + 48, 14); }
    else if (o.type === "sapling") palm(o.x + 13, o.h, 22, 8);
    else palm(o.x + 13, o.h, 30, 10);
  }
  function drawCloud(c) {
    ctx.fillStyle = "rgba(255,255,255,.9)";
    ellipse(c.x, c.y, 18 * c.s, 14 * c.s); ctx.fill();
    ellipse(c.x + 20 * c.s, c.y - 8 * c.s, 22 * c.s, 17 * c.s); ctx.fill();
    ellipse(c.x + 44 * c.s, c.y, 17 * c.s, 13 * c.s); ctx.fill();
    ctx.fillRect(c.x, c.y, 44 * c.s, 13 * c.s);
  }
  function drawBackground() {
    var k, x;
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, 380);
    ctx.fillStyle = "rgba(255,240,150,.45)"; ellipse(275, 118, 54, 54); ctx.fill();
    ctx.fillStyle = "#ffe27a"; ellipse(275, 118, 38, 38); ctx.fill();
    for (k = 0; k < clouds.length; k++) drawCloud(clouds[k]);
    ctx.fillStyle = SEA; ctx.fillRect(0, 380, W, GROUND - 380);
    ctx.fillStyle = "rgba(27,27,27,.18)"; ctx.fillRect(0, 380, W, 2);
    // far palms on the horizon
    ctx.save(); ctx.globalAlpha = 0.55; ctx.lineCap = "round";
    var off = (scroll * 0.25) % 170;
    for (k = -1; k < 4; k++) {
      x = k * 170 - off + 60;
      ctx.beginPath(); ctx.moveTo(x, 382); ctx.quadraticCurveTo(x - 3, 362, x + 3, 342);
      ctx.lineWidth = 5; ctx.strokeStyle = LEAFD; ctx.stroke();
      var a = [-2.9, -2.2, -1.57, -0.9, -0.2];
      for (var j = 0; j < a.length; j++) leaf(x + 3, 342, a[j], 20, LEAFD, false);
    }
    ctx.restore();
    // waves
    ctx.strokeStyle = "rgba(255,255,255,.55)"; ctx.lineWidth = 3; ctx.lineCap = "round";
    var rows = [412, 444, 476];
    for (var r = 0; r < rows.length; r++) {
      var wo = (scroll * (0.35 + r * 0.12) + r * 23) % 80;
      for (x = -80; x < W + 80; x += 80) {
        ctx.beginPath(); ctx.moveTo(x - wo, rows[r]); ctx.lineTo(x - wo + 24, rows[r]); ctx.stroke();
      }
    }
    // sand
    ctx.fillStyle = SAND; ctx.fillRect(0, GROUND, W, H - GROUND);
    ctx.fillStyle = INK; ctx.fillRect(0, GROUND - 2, W, 4);
    ctx.fillStyle = SANDD; ctx.lineCap = "round";
    var so = scroll % 60, pe = scroll % 90;
    for (x = -60; x < W + 60; x += 60) {
      ctx.fillRect(x - so, GROUND + 34, 26, 4);
      ctx.fillRect(x - so + 30, GROUND + 82, 20, 4);
    }
    for (x = -90; x < W + 90; x += 90) {
      ellipse(x - pe + 20, GROUND + 58, 5, 3.5); ctx.fill();
      ellipse(x - pe + 66, GROUND + 108, 4, 3); ctx.fill();
    }
  }
  function drawPlayer() {
    var img = SPR[charKey];
    var air = GROUND - P.y, sw = 24 * (1 - Math.min(air / 220, 0.55));
    ctx.fillStyle = "rgba(27,27,27,.2)"; ellipse(P.x + P.w / 2, GROUND + 5, sw, 5); ctx.fill();
    var rot = P.rot, bob = 0;
    if (state === "play" || state === "ready") {
      var run = state === "play";
      if (P.ground) { var ph = time * (run ? 17 : 3); bob = Math.abs(Math.sin(ph)) * (run ? 4 : 1.5); rot = Math.sin(ph) * (run ? 0.05 : 0.02); }
      else rot = Math.max(-0.18, Math.min(0.22, P.vy / 3500));
    }
    ctx.save();
    ctx.translate(P.x + P.w / 2, P.y - bob); ctx.rotate(rot);
    if (img.complete && img.naturalWidth) ctx.drawImage(img, -P.w / 2, -P.h, P.w, P.h);
    if (P.gliding) {
      ctx.save(); ctx.translate(-26, -P.h - 2); leaf(0, 0, 0, 52, LEAF, true); ctx.restore();
    }
    ctx.restore();
    if (state === "play" && charKey === "alice" && !P.ground && P.glide < GLIDE_MAX) {
      var gx = P.x + P.w / 2 - 16, gy = P.y - P.h - 28;
      ctx.fillStyle = INK; ctx.fillRect(gx - 2, gy - 2, 36, 9);
      ctx.fillStyle = "#ffffff"; ctx.fillRect(gx, gy, 32, 5);
      ctx.fillStyle = LEAF; ctx.fillRect(gx, gy, 32 * Math.max(0, P.glide / GLIDE_MAX), 5);
    }
  }
  function drawParts() {
    for (var k = 0; k < parts.length; k++) { var p = parts[k]; ctx.fillStyle = p.col || SANDD; ellipse(p.x, p.y, p.r, p.r); ctx.fill(); }
  }
  function label(str, x, y, size, align, fill) {
    ctx.font = size + "px " + FONT; ctx.textAlign = align; ctx.textBaseline = "alphabetic";
    ctx.lineWidth = size * 0.24; ctx.strokeStyle = INK; ctx.lineJoin = "round";
    ctx.strokeText(str, x, y); ctx.fillStyle = fill; ctx.fillText(str, x, y);
  }
  function drawHud() {
    if (state === "ready") return;
    label(Math.floor(dist) + " m", 16, 50, 38, "left", "#ffffff");
    if (best > 0) label("최고 " + best + " m", W - 16, 40, 18, "right", "#fff3c4");
    if (state === "play" && hintT > 0) {
      ctx.save(); ctx.globalAlpha = Math.min(1, hintT * 1.5);
      label(HINTS[charKey], W / 2, 92, 20, "center", "#ffffff");
      ctx.restore();
    }
    if (toast) {
      var pop = 1 + Math.max(0, toast.t - 0.9) * 2;
      ctx.save(); ctx.translate(W / 2, 150); ctx.scale(pop, pop);
      ctx.globalAlpha = Math.min(1, toast.t * 2);
      label(toast.txt, 0, 0, 44, "center", "#ffd84a");
      ctx.restore();
    }
  }
  function draw() {
    ctx.setTransform(canvas.width / W, 0, 0, canvas.height / H, 0, 0);
    ctx.clearRect(0, 0, W, H);
    ctx.save();
    if (shake > 0) ctx.translate((Math.random() - .5) * shake * 24, (Math.random() - .5) * shake * 24);
    drawBackground();
    for (var k = 0; k < obs.length; k++) drawObstacle(obs[k]);
    drawPlayer(); drawParts();
    ctx.restore();
    drawHud();
  }

  function loop(now) {
    var dt = Math.min(0.033, (now - last) / 1000); last = now; time += dt;
    update(dt); draw();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
